<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Judy ❤️</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #14000b, #3b001c, #12000a);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

.container {
  width: 92%;
  max-width: 450px;
  text-align: center;
  padding: 35px 25px;
  border-radius: 25px;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(15px);
  box-shadow: 0 0 40px rgba(255,0,100,0.25);
}

h1 {
  font-size: 32px;
  margin-bottom: 10px;
}

p {
  color: #ffd6e5;
  line-height: 1.6;
}

input {
  width: 100%;
  padding: 16px;
  margin-top: 20px;
  border: none;
  border-radius: 14px;
  outline: none;
  text-align: center;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 15px;
  border: none;
  border-radius: 14px;
  background: #ff2d75;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  transform: scale(0.97);
}

#surprise {
  display: none;
}

.heart {
  position: fixed;
  bottom: -20px;
  font-size: 22px;
  animation: float 6s linear infinite;
  opacity: 0.7;
}

@keyframes float {
  from {
    transform: translateY(0) rotate(0deg);
    opacity: 0;
  }
  20% {
    opacity: 1;
  }
  to {
    transform: translateY(-110vh) rotate(360deg);
    opacity: 0;
  }
}

.big-heart {
  font-size: 70px;
  animation: beat 1s infinite alternate;
}

@keyframes beat {
  to {
    transform: scale(1.15);
  }
}

.error {
  color: #ff8fb5;
  margin-top: 12px;
  min-height: 20px;
}
</style>
</head>

<body>

<div class="container" id="login">

  <div class="big-heart">❤️</div>

  <h1>Hey Judy...</h1>

  <p>
    I made something special for you.<br>
    But first, you need the secret password. 🔐
  </p>

  <input
    type="text"
    id="password"
    placeholder="Enter the secret password"
    autocomplete="off"
  >

  <button onclick="unlock()">Unlock My Heart 💖</button>

  <div class="error" id="error"></div>

</div>


<div class="container" id="surprise">

  <div class="big-heart">💖</div>

  <h1>Yes, Judy...</h1>

  <p>
    You're the only one. ❤️
  </p>

  <p>
    Out of all the people in this world,
    somehow my heart found you.
  </p>

  <p>
    And honestly...
    I wouldn't want it any other way. 🥹❤️
  </p>

  <button onclick="love()">One More Thing 💌</button>

</div>


<script>

function unlock() {

  const entered = document
    .getElementById("password")
    .value
    .trim();

  const correctPassword = "Pavithran's_wife";

  if (entered === correctPassword) {

    document.getElementById("login").style.display = "none";
    document.getElementById("surprise").style.display = "block";

  } else {

    document.getElementById("error").innerText =
      "Hmm... that's not the secret password 😏❤️";

  }
}


function love() {

  document.getElementById("surprise").innerHTML = `
    <div class="big-heart">💗</div>

    <h1>Judy ❤️</h1>

    <p>
      You are not just someone I love...
    </p>

    <p>
      You are the person I want beside me
      through all the chapters of my life.
    </p>

    <p>
      <strong>
      My favourite person.<br>
      My happiness.<br>
      My forever. ❤️
      </strong>
    </p>

    <p>
      — Pavithran
    </p>
  `;

}


// Floating hearts

setInterval(function() {

  const heart = document.createElement("div");

  heart.className = "heart";
  heart.innerHTML = "❤️";

  heart.style.left =
    Math.random() * 100 + "vw";

  heart.style.animationDuration =
    (4 + Math.random() * 4) + "s";

  document.body.appendChild(heart);

  setTimeout(function() {
    heart.remove();
  }, 8000);

}, 700);

</script>

</body>
</html>
